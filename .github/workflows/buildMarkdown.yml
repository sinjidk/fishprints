name: Generate Markdown
on: 
  workflow_dispatch: 
  push:
    branches:
      - main
  pull_request:
    types:
      - ready_for_review
      - review_requested
jobs:
  Initalize-References:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Perform initialization
        run: |
          cd docs
          find . -mindepth 1 -type d | while read dir; do
            refpath="${dir}/reference"
            if [ ! -f "${refpath}" ]; then
              echo "${refpath} does not exist"
              refimage="$(find $dir -mindepth 1 -type f -name '*.png' -print -quit)"
              fname="${refimage#$dir/}"
              dname="${dir##*/}"
              text="$dname/$fname"
              echo "${text}" > "${refpath}"
              echo "${refpath} generated with ${text}"
            fi
          done
      - name: Commit changes
        id: commitStep
        run: |  
          git config --global user.email "170571194+sinjidk@users.noreply.github.com"
          git config --global user.name "sinjidk"
          git add .
          if [ ! -z "$(git status -s)" ]; then
            git commit -m "Reference initialization"
            git push origin ${{ github.ref_name }}
          else
            echo "No new reference files"
          fi
          
  Generate-Markdown:
    needs: Initalize-References
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Pull changes from prior job
        run: |  
          git pull
          echo "$(git status)"

      - name: Perform generation
        run: |
          cd docs
          NL=$'\n'
          find . -type d | while read dir; do
            if [ -z "$(find $dir -mindepth 1 -maxdepth 1 -type d)" ]; then
              echo "$dir is leaf"
              md=""
              files="$(find $dir -type f -name '*.png')"
              while read file; do
                fname="${file#$dir/}"
                fnamebare="${fname%.png}"
                text="![${fnamebare%_*}](${fname// /%20})${NL}"
                md+="${text}"
                echo "Added ${text}"
              done <<< "${files}"
              echo "${md}" > "${dir}/README.md"
              echo "generated markdown for ${dir}"
            else
              echo "$dir is branch"
              md=""
              refs="$(find $dir -mindepth 2 -maxdepth 2 -type f -name 'reference')"
              while read file; do
                if [ -z "$file" ]; then
                  continue
                fi
                fname="${file#$dir/}"
                dname="${fname%/reference}"
                text="[![${dname}]($(cat $file | sed -e 's/ /%20/g'))${NL}](${dname})"
                md+="${text}"
                echo "Added ${text}"
              done <<< "${refs}"
              echo "${md}" > "${dir}/README.md"
              echo "generated markdown for ${dir}"
            fi
          done
      - name: Commit changes
        run: |  
          git config --global user.email "170571194+sinjidk@users.noreply.github.com"
          git config --global user.name "sinjidk"
          git add .
          if [ ! -z "$(git status -s)" ]; then
            git commit -m "Reference initialization"
            git push origin ${{ github.ref_name }}
          else
            echo "No markdown changes"
          fi
